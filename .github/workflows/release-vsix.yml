name: Release VSIX

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-vsix:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v3

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Restore
        run: nuget restore Conviso.Platform.VisualStudio.sln

      - name: Build Release
        run: msbuild src\Conviso.Platform.VisualStudio\Conviso.Platform.VisualStudio.csproj /t:Build /p:Configuration=Release /m

      - name: Locate VSIX
        id: locate_vsix
        shell: pwsh
        run: |
          $vsix = Get-ChildItem -Path "$env:GITHUB_WORKSPACE" -Filter *.vsix -Recurse | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $vsix) {
            Write-Error "No .vsix artifact was generated."
            exit 1
          }

          "vsix_path=$($vsix.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "vsix_name=$($vsix.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "VSIX found at $($vsix.FullName)"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $title = "Conviso Platform Visual Studio $tag"
          $notes = @"
          Visual Studio extension package for $tag.

          Asset:
          - ${{ steps.locate_vsix.outputs.vsix_name }}
          "@

          gh release create $tag "${{ steps.locate_vsix.outputs.vsix_path }}" --repo "${{ github.repository }}" --title $title --notes $notes
